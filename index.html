<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تدريب أحكام الراءات التفاعلي</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #ecf0f1;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            position: relative;
        }
        h2 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.5rem; }
        .input-group { margin: 20px 0; text-align: center; }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--secondary); }
        button.start-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 90%;
            font-weight: bold;
        }
        .progress {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            background-color: #f39c12;
            color: white;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary);
        }
        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            background-color: #fff;
            color: var(--text);
            border: 2px solid #ecf0f1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: right;
            line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background-color: #f7f9fa; }
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        #feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: bold;
        }
        .next-btn-container { text-align: center; margin-top: 20px; }
        #next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
        .year-footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #95a5a6;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .hidden { display: none !important; }
        .result-container { text-align: center; }
        .score-display { font-size: 2rem; color: var(--success); font-weight: bold; margin: 20px 0; }
        .retry-btn { background-color: #e67e22; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 15px;}
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>تدريب أحكام الراءات - المستوى الخامس</h2>
    <div class="input-group">
        <p>الرجاء إدخال اسمك للبدء:</p>
        <input type="text" id="student-name" placeholder="الاسم الثلاثي">
    </div>
    <div style="text-align: center;">
        <button class="start-btn" onclick="startQuiz()">ابدأ التدريب</button>
    </div>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="progress" id="progress-text"></div>
    <div id="badge-container"></div>
    <div class="question-text" id="question-text"></div>
    <div id="options-container"></div>
    
    <div id="feedback"></div>
    
    <div class="next-btn-container">
        <button id="next-btn" class="hidden" onclick="nextQuestion()">السؤال التالي</button>
    </div>
    <div class="year-footer" id="year-footer"></div>
</div>

<div class="container hidden result-container" id="result-screen">
    <h2>انتهى التدريب!</h2>
    <p style="font-size: 1.2rem;" id="student-name-display"></p>
    <div class="score-display"><span id="score"></span> / <span id="total-score"></span></div>
    <p id="saving-msg" style="color: #7f8c8d;">جاري حفظ النتيجة في السجل...</p>
    <button id="retry-btn" class="retry-btn hidden" onclick="retryWrongQuestions()">إعادة حل الأسئلة الخاطئة</button>
</div>

<script>
    // رابط الإكسيل الخاص بك
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9-dRpBl0rFkrTG0wNm-alTT1DlAAC2Y2HbcRuZYyrWYRqfSgT0UwXt1CF1o41Vvmu/exec";

    // بنك الأسئلة الشامل بعد دمج النماذج الرسمية وتطابق الشواهد حرفياً
    const allQuestions = [
        { q: "لم يذكر الناظم إلا حكم ترقيق الراء المكسورة وصلا في عبارته في باب الراءات.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (ذكر الناظم ترقيق الراء المتحركة والساكنة وقفا ووصلا)", year: "فبراير 24 / يونيو 25 / أغسطس 26" },
        { q: "حكم الرء الممالة الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح", year: "فبراير 24 / يونيو 24 / أغسطس 25" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (فرقة):", type: "Fill", options: ["وَرَقَّقِ الرَّاءَ ... إِنْ لَمْ تَكُنْ مِنْ قَبْلِ حَرْفِ اسْتِعْلا ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً ... (( والمفهوم مخالف للمنطوق))", "وَالْخُلْفُ فِي فِرْقٍ لِكَسْرِ يُوجَدُ.", "وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ (( والمفهوم مخالف للمنطوق))"], ans: 0, exp: "لأن حرف الاستعلاء جاء بعد الراء الساكنة.", year: "فبراير 24 / يونيو 26" },
        { q: "الشاهد من الجزرية على خلاف القراء في ترقيق وتفخيم الراء في كلمة (فرق) هو:", type: "Fill", options: ["وَالْخُلْفُ فِي فِرْقٍ لِكَسْرِ يُوجَدُ.", "وَرَقَّقِ الرَّاءَ إِذَا مَا كُسِرَتْ. (( والمفهوم مخالف للمنطوق ))", "وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ (( والمفهوم مخالف للمنطوق))"], ans: 0, exp: "وَالْخُلْفُ فِي فِرْقٍ لِكَسْرِ يُوجَدُ.", year: "فبراير 24 / فبراير 25 / فبراير 26" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (رب ارجعون / رب ارحمهما / ارجعي / اركعوا):", type: "Fill", options: ["وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... إِنْ لَمْ تَكُنْ مِنْ قَبْلِ حَرْفِ اسْتِعْلا ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ إِذَا مَا كُسِرَتْ. (( والمفهوم مخالف للمنطوق ))"], ans: 0, exp: "لأن الكسرة عارضة أو منفصلة.", year: "فبراير 24 / أبريل 25 / ديسمبر 25 / يونيو 24" },
        { q: "استدل من الجزرية على تفخيم الراء الساكنة بعد ضم أو فتح، كما في كلمة (القرآن / خسر / القدر وقفا):", type: "Fill", options: ["وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... إِنْ لَمْ تَكُنْ مِنْ قَبْلِ حَرْفِ اسْتِعْلا ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ إِذَا مَا كُسِرَتْ. (( والمفهوم مخالف للمنطوق ))"], ans: 0, exp: "لأنها ساكنة بعد ضم أو فتح.", year: "فبراير 24 / يونيو 24 / ديسمبر 24" },
        { q: "اشترط الناظم لترقيق الراء المكسورة في قوله: (ورقق الراء إذا ما كسرت) أن تكون الكسرة أصلية.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (أصلية أو عارضة)", year: "أبريل 25 / ديسمبر 24" },
        { q: "حكم الراء المرامة هو: التفخيم أو الترقيق بحسب حركتها.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح", year: "أبريل 25 / مايو 26 / يونيو 24" },
        { q: "الشاهد من المقدمة الجزرية على تفخيم الراء المضمومة أو المفتوحة (رُزِقْنَا / ربما / الصراط):", type: "Fill", options: ["وَرَقَّقِ الرَّاءَ إِذَا مَا كُسِرَتْ. (( والمفهوم مخالف للمنطوق ))", "وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً ... (( والمفهوم مخالف للمنطوق))", "وَالْخُلْفُ فِي فِرْقٍ لِكَسْرِ يُوجَدُ."], ans: 0, exp: "لأن الراء متحركة بغير الكسر.", year: "أبريل 25 / ديسمبر 25 / يونيو 24" },
        { q: "حكم الراء المرامة في حالة الوقف بالكسر هو الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح", year: "أغسطس 25 / يونيو 24 / ديسمبر 25" },
        { q: "لم يصرح ابن الجزري بحكم تفخيم الراء في المقدمة، لأن أصلها التفخيم، أو للمفهوم المخالف من عبارته.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح", year: "أكتوبر 25 / أبريل 24" },
        { q: "حكم الراء المرامة في حالة الوقف بالضم هو الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (التفخيم)", year: "أكتوبر 25 / أبريل 24 / يونيو 25" },
        { q: "حكم الراء المضمومة حالة الوقف عليها بالروم هو:", type: "Fill", options: ["التفخيم", "الترقيق", "جواز الوجهين", "الإخفاء"], ans: 0, exp: "التفخيم (الروم يعامل معاملة الوصل).", year: "يونيو 26" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة لَبِالْمِرْصَاد / ارصاد هو:", type: "Fill", options: ["وَرَقَّقِ الرَّاءَ ... إِنْ لَمْ تَكُنْ مِنْ قَبْلِ حَرْفِ اسْتِعْلا ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً ... (( والمفهوم مخالف للمنطوق))", "وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ (( والمفهوم مخالف للمنطوق))", "وَالْخُلْفُ فِي فِرْقٍ لِكَسْرِ يُوجَدُ."], ans: 0, exp: "لوقوع حرف الاستعلاء غير المكسور بعد الراء الساكنة.", year: "أكتوبر 25 / يونيو 24" },
        { q: "ينقسم الراء من حيث التفخيم والترقيق من حيث مفهوم الناظم إلى:", type: "MCQ", options: ["قسمين", "ثلاثة أقسام", "أربعة أقسام", "خمسة أقسام"], ans: 1, exp: "ثلاثة أقسام.", year: "ديسمبر 24" },
        { q: "حكم الراء الممالة هو التفخيم أو الترقيق حسب حركتها.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (هذا تعريف الراء المرامة وليس الممالة)", year: "ديسمبر 25" },
        { q: "حكم الراء المكسورة في حال الوقف عليها بالروم هو:", type: "Fill", options: ["الترقيق", "التفخيم", "جواز الوجهين", "الإخفاء"], ans: 0, exp: "الترقيق.", year: "فبراير 26 / فبراير 25" },
        { q: "حكم الراء الممالة التفخيم.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (الترقيق)", year: "فبراير 26 / فبراير 25 / أغسطس 26" },
        { q: "الشاهد من الجزرية على ترقيق الراء في كلمة (رِجَالٌ) هو:", type: "Fill", options: ["وَرَقَّقِ الرَّاءَ إِذَا مَا كُسِرَتْ.", "وَرَقَّقِ الرَّاءَ ... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ", "وَرَقَّقِ الرَّاءَ ... إِنْ لَمْ تَكُنْ مِنْ قَبْلِ حَرْفِ اسْتِعْلا", "وَرَقَّقِ الرَّاءَ ... أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً"], ans: 0, exp: "لأنها متحركة بالكسر.", year: "فبراير 26" }
    ];

    let studentName = "";
    let score = 0;
    let currentQuestionIndex = 0;
    let activeQuestions = [];
    let wrongQuestionsLog = []; 
    let wrongQuestionsObjects = []; 
    let isRetryMode = false;

    function startQuiz() {
        const nameInput = document.getElementById("student-name").value.trim();
        if (nameInput === "") {
            alert("يرجى إدخال اسمك للمتابعة.");
            return;
        }
        studentName = nameInput;
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        
        activeQuestions = [...allQuestions];
        score = 0;
        wrongQuestionsLog = [];
        wrongQuestionsObjects = [];
        currentQuestionIndex = 0;
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").classList.add("hidden");
        
        const q = activeQuestions[currentQuestionIndex];
        
        document.getElementById("progress-text").innerText = `السؤال ${currentQuestionIndex + 1} من ${activeQuestions.length}`;
        
        const badgeContainer = document.getElementById("badge-container");
        if(q.type === "Fill" || q.type === "Essay") {
            badgeContainer.innerHTML = `<span class="badge">سؤال مقالي / أكمل (معدل للاختيارات للتدريب)</span>`;
        } else {
            badgeContainer.innerHTML = "";
        }

        document.getElementById("question-text").innerText = q.q;
        document.getElementById("year-footer").innerText = `المصدر: نموذج إجابة الوزارة (${q.year})`;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.className = "option-btn";
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);

        const q = activeQuestions[currentQuestionIndex];
        const feedbackDiv = document.getElementById("feedback");
        feedbackDiv.style.display = "block";

        if (selectedIndex === q.ans) {
            btnElement.classList.add("correct");
            feedbackDiv.style.backgroundColor = "#e8f5e9";
            feedbackDiv.style.color = "#2e7d32";
            feedbackDiv.innerText = "إجابة صحيحة ✔️\nالتعليل: " + q.exp;
            if (!isRetryMode) score += 2; 
        } else {
            btnElement.classList.add("wrong");
            buttons[q.ans].classList.add("correct"); 
            feedbackDiv.style.backgroundColor = "#ffebee";
            feedbackDiv.style.color = "#c62828";
            feedbackDiv.innerText = "إجابة خاطئة ❌\nالصواب: " + q.exp;
            
            if (!isRetryMode) {
                wrongQuestionsLog.push(q.q); 
                wrongQuestionsObjects.push(q); 
            }
        }
        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        
        document.getElementById("student-name-display").innerText = "الطالبة: " + studentName;
        document.getElementById("score").innerText = score;
        
        const totalPossible = isRetryMode ? score : (allQuestions.length * 2);
        document.getElementById("total-score").innerText = allQuestions.length * 2;

        const retryBtn = document.getElementById("retry-btn");
        if (wrongQuestionsObjects.length > 0 && !isRetryMode) {
            retryBtn.classList.remove("hidden");
        } else {
            retryBtn.classList.add("hidden");
        }

        if (!isRetryMode) {
            sendDataToSheet(totalPossible);
        } else {
            document.getElementById("saving-msg").classList.add("hidden");
        }
    }

    function retryWrongQuestions() {
        isRetryMode = true;
        activeQuestions = [...wrongQuestionsObjects];
        wrongQuestionsObjects = [];
        currentQuestionIndex = 0;
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function sendDataToSheet(totalPossible) {
        const payload = {
            name: studentName,
            score: score,
            total: totalPossible,
            wrongQuestions: wrongQuestionsLog 
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById("saving-msg").innerText = "تم حفظ النتيجة بنجاح ✔️";
            document.getElementById("saving-msg").style.color = "#27ae60";
        }).catch(err => {
            document.getElementById("saving-msg").innerText = "حدث خطأ أثناء حفظ النتيجة.";
            document.getElementById("saving-msg").style.color = "#e74c3c";
        });
    }
</script>

</body>
</html>
