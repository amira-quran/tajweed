<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدريب أحكام الراءات</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f7fa;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            margin: 5px;
        }
        button:hover { background-color: #357abd; }
        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            background-color: #f8f9fa;
            color: var(--text);
            border: 2px solid #e9ecef;
        }
        .option-btn:hover { background-color: #e2e6ea; }
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        #feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
        }
        .hidden { display: none; }
        #next-btn { background-color: #2c3e50; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>تدريب أحكام الراءات</h2>
    <p>أدخلي اسمك للبدء:</p>
    <input type="text" id="student-name" placeholder="الاسم الثلاثي">
    <br>
    <button onclick="startQuiz()">ابدأ التدريب</button>
</div>

<div class="container hidden" id="quiz-screen">
    <h3 id="question-text"></h3>
    <div id="options-container"></div>
    
    <div id="feedback"></div>
    <button id="next-btn" class="hidden" onclick="nextQuestion()">السؤال التالي</button>
</div>

<div class="container hidden" id="result-screen">
    <h2>انتهى التدريب!</h2>
    <p id="student-name-display"></p>
    <h3>درجتك: <span id="score"></span> / <span id="total-score"></span></h3>
    <button id="retry-btn" class="hidden" onclick="retryWrongQuestions()">إعادة الأسئلة الخاطئة</button>
</div>

<script>
    // رابط Google Apps Script الخاص بك
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9-dRpBl0rFkrTG0wNm-alTT1DlAAC2Y2HbcRuZYyrWYRqfSgT0UwXt1CF1o41Vvmu/exec";

    // بنك الأسئلة (كل سؤال بدرجتين)
    const allQuestions = [
        {
            question: "حكم الراء الممالة الترقيق.",
            options: ["صح", "خطأ"],
            correctIndex: 0,
            explanation: "إجابة صحيحة. الراء الممالة حكمها الترقيق وجهاً واحداً مثل كلمة (مَجْرَاهَا)."
        },
        {
            question: "حكم الراء المرامة في حالة الوقف بالضم هو التفخيم.",
            options: ["صح", "خطأ"],
            correctIndex: 0,
            explanation: "إجابة صحيحة. لأن الروم كالوصل، والراء المضمومة تفخم."
        },
        {
            question: "ينقسم الراء من حيث التفخيم والترقيق من مفهوم قول الناظم إلى:",
            options: ["قسمين", "ثلاثة أقسام", "أربعة أقسام", "خمسة أقسام"],
            correctIndex: 1,
            explanation: "ثلاثة أقسام: قسم يفخم دائماً، وقسم يرقق دائماً، وقسم يجوز فيه الوجهان."
        },
        {
            question: "لم يذكر الناظم إلا حكم ترقيق الراء المكسورة وصلاً في عبارته في باب الراءات.",
            options: ["صح", "خطأ"],
            correctIndex: 1,
            explanation: "خطأ. بل ذكر حكم الراء الساكنة بعد كسر، وحكم (فرق)، وحكم إخفاء التكرير."
        }
    ];

    let studentName = "";
    let score = 0;
    let currentQuestionIndex = 0;
    let activeQuestions = [];
    let wrongQuestions = [];
    let isRetryMode = false;

    function startQuiz() {
        const nameInput = document.getElementById("student-name").value.trim();
        if (nameInput === "") {
            alert("الرجاء كتابة الاسم أولاً.");
            return;
        }
        studentName = nameInput;
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        
        activeQuestions = [...allQuestions];
        score = 0;
        wrongQuestions = [];
        currentQuestionIndex = 0;
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").classList.add("hidden");
        
        const q = activeQuestions[currentQuestionIndex];
        document.getElementById("question-text").innerText = q.question;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.className = "option-btn";
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        // تعطيل الأزرار بعد الاختيار
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);

        const q = activeQuestions[currentQuestionIndex];
        const feedbackDiv = document.getElementById("feedback");
        feedbackDiv.style.display = "block";

        if (selectedIndex === q.correctIndex) {
            btnElement.classList.add("correct");
            feedbackDiv.style.backgroundColor = "#d4edda";
            feedbackDiv.style.color = "#155724";
            feedbackDiv.innerText = "إجابة صحيحة! أحسنتِ.";
            if (!isRetryMode) score += 2; // نقطتين لكل سؤال
        } else {
            btnElement.classList.add("wrong");
            buttons[q.correctIndex].classList.add("correct"); // إظهار الإجابة الصحيحة
            feedbackDiv.style.backgroundColor = "#f8d7da";
            feedbackDiv.style.color = "#721c24";
            feedbackDiv.innerText = "إجابة خاطئة. " + q.explanation;
            
            if (!isRetryMode) {
                wrongQuestions.push(q);
            }
        }

        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        
        document.getElementById("student-name-display").innerText = "الطالبة: " + studentName;
        document.getElementById("score").innerText = score;
        const totalPossible = isRetryMode ? score : (allQuestions.length * 2);
        document.getElementById("total-score").innerText = allQuestions.length * 2;

        const retryBtn = document.getElementById("retry-btn");
        if (wrongQuestions.length > 0 && !isRetryMode) {
            retryBtn.classList.remove("hidden");
        } else {
            retryBtn.classList.add("hidden");
        }

        // إرسال البيانات إلى Google Sheets فقط في المحاولة الأولى
        if (!isRetryMode) {
            sendDataToSheet(totalPossible);
        }
    }

    function retryWrongQuestions() {
        isRetryMode = true;
        activeQuestions = [...wrongQuestions];
        wrongQuestions = [];
        currentQuestionIndex = 0;
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function sendDataToSheet(totalPossible) {
        const payload = {
            name: studentName,
            score: score,
            total: totalPossible
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // يتجاهل رسائل خطأ CORS
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        }).then(response => {
            console.log("تم الإرسال بنجاح");
        }).catch(error => {
            console.error("خطأ في الإرسال:", error);
        });
    }
</script>

</body>
</html>
