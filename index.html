<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تدريب أحكام الراءات التفاعلي</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #ecf0f1;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            position: relative;
        }
        h2 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.5rem; }
        .input-group { margin: 20px 0; text-align: center; }
        input[type="text"], select {
            width: 90%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            font-family: inherit;
        }
        input[type="text"]:focus, select:focus { border-color: var(--secondary); }
        button.start-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 90%;
            font-weight: bold;
        }
        /* تصميم شريط التقدم */
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            height: 12px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            background-color: #f39c12;
            color: white;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary);
        }
        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            background-color: #fff;
            color: var(--text);
            border: 2px solid #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: right;
            line-height: 1.5;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background-color: #f7f9fa; }
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        #feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: bold;
        }
        .next-btn-container { text-align: center; margin-top: 20px; }
        #next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
        .year-footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #95a5a6;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .hidden { display: none !important; }
        .result-container { text-align: center; }
        .score-display { font-size: 2.5rem; color: var(--success); font-weight: bold; margin: 20px 0; }
        .retry-btn { background-color: #e67e22; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 15px;}
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>تدريب أحكام الراءات - المستوى الخامس</h2>
    <div class="input-group">
        <p>الرجاء إدخال اسمك واختيار النموذج:</p>
        <input type="text" id="student-name" placeholder="الاسم الثلاثي">
        <select id="model-select">
            <option value="1">النموذج الأول (20 سؤال - 40 درجة)</option>
            <option value="2">النموذج الثاني (20 سؤال - 40 درجة)</option>
            <option value="3">النموذج الثالث (20 سؤال - 40 درجة)</option>
        </select>
    </div>
    <div style="text-align: center;">
        <button class="start-btn" onclick="startQuiz()">ابدأ التدريب</button>
    </div>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div class="progress-text" id="progress-text"></div>
    
    <div id="badge-container"></div>
    <div class="question-text" id="question-text"></div>
    <div id="options-container"></div>
    
    <div id="feedback"></div>
    
    <div class="next-btn-container">
        <button id="next-btn" class="hidden" onclick="nextQuestion()">السؤال التالي</button>
    </div>
    <div class="year-footer" id="year-footer"></div>
</div>

<div class="container hidden result-container" id="result-screen">
    <h2>انتهى التدريب!</h2>
    <p style="font-size: 1.2rem;" id="student-name-display"></p>
    <div class="score-display"><span id="score"></span> / <span id="total-score"></span></div>
    <p id="saving-msg" style="color: #7f8c8d;">جاري حفظ النتيجة في السجل...</p>
    <button id="retry-btn" class="retry-btn hidden" onclick="retryWrongQuestions()">إعادة حل الأسئلة الخاطئة</button>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9-dRpBl0rFkrTG0wNm-alTT1DlAAC2Y2HbcRuZYyrWYRqfSgT0UwXt1CF1o41Vvmu/exec";

    // الإجابات النموذجية 
    const optMaftuha = "(وَرَقِّقِ الرَّاءَ إِذَا مَا كُسِرَتْ) (( والمفهوم مخالف للمنطوق ))";
    const optMaksura = "(وَرَقِّقِ الرَّاءَ إِذَا مَا كُسِرَتْ)";
    const optSakinaFath = "(وَرَقِّقِ الرَّاءَ.... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ) (( والمفهوم مخالف للمنطوق ))";
    const optIsti3la = "(وَرَقِّقِ الرَّاءَ ...كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ إِنْ لَمْ تَكُنْ مِنْ قَبْلِ حَرْفِ اسْتِعْلا) (( والمفهوم مخالف للمنطوق ))";
    const optKasrArid = "(وَرَقِّقِ الرَّاءَ.... كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ أَوْ كَانَتِ الْكَسْرَةُ لَيْسَتْ أَصْلاً) (( والمفهوم مخالف للمنطوق ))";
    const optFirq = "(وَالْخُلْفُ فِي فِرْقٍ لِكَسْرٍ يُوجَدُ)";
    const optMuntashir = "(وَرَقِّقِ الرَّاءَ ...كَذَاكَ بَعْدَ الْكَسْرِ حَيْثُ سَكَنَتْ)";

    // ---------------- النموذج الأول (20 سؤال) ----------------
    const model1 = [
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة بعد ضم لكلمة (القربى) هو:", type: "Fill", options: [optSakinaFath, optMaftuha, optIsti3la, optKasrArid], ans: 0, exp: "لأنها ساكنة بعد ضم.", year: "أبريل 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء المضمومة لكلمة (ربما):", type: "Fill", options: [optMaftuha, optSakinaFath, optIsti3la, optKasrArid], ans: 0, exp: "لأن الراء مضمومة.", year: "أبريل 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (لبلمرصاد) هو:", type: "Fill", options: [optIsti3la, optSakinaFath, optMaftuha, optKasrArid], ans: 0, exp: "لوقوع حرف الاستعلاء بعدها.", year: "أبريل 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (لَبِالْمِرْصَادِ) هو: المفهوم المخالف لقول الناظم:", type: "Fill", options: [optIsti3la, optSakinaFath, optMaftuha, optKasrArid], ans: 0, exp: "لوقوع حرف الاستعلاء بعدها.", year: "أكتوبر 2025" },
        { q: "الشاهد من الجزرية على تفخيم الراء المضمومة لكلمة (الذكر) وقفا هو:", type: "Fill", options: [optSakinaFath, optMaftuha, optIsti3la, optKasrArid], ans: 0, exp: "لأنها ساكنة سكوناً عارضاً بعد فتح.", year: "أبريل 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء المضمومة لكلمة (الذَّكَرُ) وقفاً من قوله تعالى: {وَلَيْسَ الذَّكَرُ كَالْأُنْثَى} هو:", type: "Fill", options: [optSakinaFath, optMaftuha, optIsti3la, optKasrArid], ans: 0, exp: "لأنها سكنت سكوناً عارضاً بعد فتح.", year: "يونيو 25 / مايو 26" },
        { q: "أن يستدل من الجزرية على تفخيم الراء الساكنة بعد كسر عارض متصل:", type: "Fill", options: [optKasrArid, optMaftuha, optIsti3la, optSakinaFath], ans: 0, exp: "لأن الكسرة عارضة (همزة وصل).", year: "أبريل 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (إن ارتبتم) هو:", type: "Fill", options: [optKasrArid, optMaftuha, optIsti3la, optSakinaFath], ans: 0, exp: "لأن الكسرة منفصلة في كلمة أخرى.", year: "أبريل 2024" },
        { q: "الشاهد من المقدمة الجزرية على تفخيم الراء الساكنة في كلمة (إنِ ارْتَبْتُمْ) هو قول الناظم:", type: "Fill", options: [optKasrArid, optMaftuha, optIsti3la, optSakinaFath], ans: 0, exp: "لأن الكسرة منفصلة.", year: "أبريل 2025" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (قرطاس) هو:", type: "Fill", options: [optIsti3la, optMaftuha, optKasrArid, optSakinaFath], ans: 0, exp: "لوقوع حرف الاستعلاء بعدها.", year: "أكتوبر 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء المضمومة المنونة في كلمة (مستقر) هو:", type: "Fill", options: [optMaftuha, optSakinaFath, optIsti3la, optKasrArid], ans: 0, exp: "لأن الراء مضمومة.", year: "أكتوبر 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (اركعوا) هو:", type: "Fill", options: [optKasrArid, optMaftuha, optIsti3la, optSakinaFath], ans: 0, exp: "لأن الكسرة عارضة.", year: "أكتوبر 24 / فبراير 25" },
        { q: "الشاهد من الجزرية على تفخيم الراء المضمومة المنونة في كلمة (غفور) هو:", type: "Fill", options: [optMaftuha, optSakinaFath, optIsti3la, optKasrArid], ans: 0, exp: "لأن الراء مضمومة.", year: "أكتوبر 2024" },
        { q: "لم يذكر الناظم إلا حكم ترقيق الراء المكسورة وصلا في عبارته في باب الراءات.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "ذكر ترقيق المتحركة والساكنة وقفا ووصلا.", year: "متكرر" },
        { q: "حكم الراء الممالة الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "الراء الممالة ترقق قولا واحداً.", year: "متكرر" },
        { q: "اشترط الناظم لترقيق الراء المكسورة في قوله (ورقق الراء إذا ما كسرت) أن تكون الكسرة أصلية.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (اشترط أن تكون أصلية أو عارضة).", year: "ديسمبر 2024" },
        { q: "حكم الراء المرامة هو: التفخيم أو الترقيق بحسب حركتها.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح (تعامل معاملة الوصل).", year: "أبريل 2025" },
        { q: "حكم الراء المرامة في حالة الوقف بالكسر هو الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح.", year: "أغسطس 2025" },
        { q: "ينقسم الراء من حيث التفخيم والترقيق إلى:", type: "MCQ", options: ["قسمين", "ثلاثة أقسام", "أربعة أقسام"], ans: 1, exp: "ثلاثة أقسام.", year: "ديسمبر 2024" },
        { q: "لم يصرح ابن الجزري بحكم تفخيم الراء في المقدمة، لأن أصلها التفخيم، أو للمفهوم المخالف.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح.", year: "أكتوبر 2025" }
    ];

    // ---------------- النموذج الثاني (20 سؤال) ----------------
    const model2 = [
        { q: "استدل من الجزرية على تفخيم الراء الساكنة بعد فتح:", type: "Fill", options: [optSakinaFath, optMaftuha, optKasrArid, optIsti3la], ans: 0, exp: "لأنها ساكنة بعد فتح.", year: "أكتوبر 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة بعد فتح لكلمة (القدر) وقفا هو:", type: "Fill", options: [optSakinaFath, optMaftuha, optKasrArid, optIsti3la], ans: 0, exp: "لأنها سكنت سكوناً عارضاً بعد فتح.", year: "يونيو 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (ارجعون) هو:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة عارضة (همزة وصل).", year: "ديسمبر 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (رَبِّ ارْجِعُونِ) هو:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة عارضة.", year: "يونيو 2025" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (رب ارجعون) هو:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة عارضة.", year: "فبراير 24 / أغسطس 26" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (خسر) هو:", type: "Fill", options: [optSakinaFath, optMaftuha, optKasrArid, optIsti3la], ans: 0, exp: "لأنها ساكنة بعد ضم.", year: "ديسمبر 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة: {خُسْرٍ} هو : المفهوم المخالف لقول الناظم:", type: "Fill", options: [optSakinaFath, optMaftuha, optKasrArid, optIsti3la], ans: 0, exp: "لأنها ساكنة بعد ضم.", year: "أغسطس 2025" },
        { q: "الشاهد من الجزرية على تفخيم الراء المفتوحة هو:", type: "Fill", options: [optMaftuha, optSakinaFath, optKasrArid, optIsti3la], ans: 0, exp: "يؤخذ من عكس ترقيق المكسورة.", year: "ديسمبر 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء المفتوحة هو: المفهوم المخالف لقول الناظم:", type: "Fill", options: [optMaftuha, optSakinaFath, optKasrArid, optIsti3la], ans: 0, exp: "المفهوم المخالف للمكسورة.", year: "أكتوبر 2025" },
        { q: "الشاهد من الجزرية على خلاف القراء في ترقيق وتفخيم الراء في كلمة (فرق) هو:", type: "Fill", options: [optFirq, optMaftuha, optSakinaFath, optKasrArid], ans: 0, exp: "نص عليها الناظم صراحة.", year: "فبراير 24 / 25 / 26" },
        { q: "الشاهد من المقدمة الجزرية على تفخيم الراء المضمومة لكلمة (رُزِقْنَا) هو المفهوم المخالف لقول الناظم:", type: "Fill", options: [optMaftuha, optSakinaFath, optKasrArid, optIsti3la], ans: 0, exp: "لأنها مضمومة.", year: "أبريل 2025" },
        { q: "الشاهد من المقدمة الجزرية على تفخيم الراء الساكنة في كلمة (ارْجِعِي) هو قول الناظم:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة عارضة.", year: "أبريل 2025" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (فرقة) هو:", type: "Fill", options: [optIsti3la, optMaftuha, optKasrArid, optSakinaFath], ans: 0, exp: "لوقوع حرف الاستعلاء بعدها.", year: "فبراير 24" },
        { q: "حكم الراء المرامة في حالة الوقف بالضم هو الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (التفخيم لأن الروم كالوصل).", year: "أكتوبر 2025" },
        { q: "حكم الراء المضمومة حالة الوقف عليها بالروم هو:", type: "Fill", options: ["التفخيم", "الترقيق", "جواز الوجهين", "الإخفاء"], ans: 0, exp: "التفخيم.", year: "يونيو 2026" },
        { q: "حكم الراء الممالة هو التفخيم أو الترقيق حسب حركتها.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "هذا تعريف المرامة وليس الممالة.", year: "ديسمبر 2025" },
        { q: "حكم الراء المكسورة في حال الوقف عليها بالروم هو:", type: "Fill", options: ["التفخيم", "الترقيق", "جواز الوجهين", "الإخفاء"], ans: 1, exp: "الترقيق.", year: "فبراير 2026" },
        { q: "ذهب الجمهور من أهل الأداء إلى أن أصل الراء الترقيق.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (أصلها التفخيم).", year: "أكتوبر 2024" },
        { q: "أسباب ترقيق الراء ثلاثة: الكسرة، والياء الساكنة، والإمالة.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح.", year: "معلومات الشرح" },
        { q: "الوقف على (مصر) والقطر فيه جواز الوجهين، واختار ابن الجزري التفخيم في مصر.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح (نظراً لحال الوصل).", year: "معلومات الشرح" }
    ];

    // ---------------- النموذج الثالث (20 سؤال) ----------------
    const model3 = [
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (فِرْقَةٍ) هو:", type: "Fill", options: [optIsti3la, optMaftuha, optKasrArid, optSakinaFath], ans: 0, exp: "لوقوع حرف الاستعلاء بعدها.", year: "يونيو 2026" },

        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة في كلمة (أَمِ ارْتَابُوا) هو قول الناظم:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة منفصلة عارضة.", year: "أغسطس 2025" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة لكلمة (رب ارحمهما) هو:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة منفصلة عارضة.", year: "يونيو 2024" },
        { q: "الشاهد من الجزرية على تفخيم الراء الساكنة في كلمة (رَبِّ ارْحَمْهُمَا) هو المفهوم المخالف لقول الناظم:", type: "Fill", options: [optKasrArid, optMaftuha, optSakinaFath, optIsti3la], ans: 0, exp: "لأن الكسرة منفصلة.", year: "أكتوبر 2025" },
        { q: "الشاهد من الجزرية على ترقيق الراء في كلمة (رِجَالٌ) هو:", type: "Fill", options: [optMaksura, optMaftuha, optSakinaFath, optKasrArid], ans: 0, exp: "لأنها متحركة بالكسر.", year: "فبراير 2026" },
        { q: "الشاهد من المقدمة الجزرية على تفخيم الراء الساكنة لكلمة (إرصادا) هو:", type: "Fill", options: [optIsti3la, optMaftuha, optKasrArid, optSakinaFath], ans: 0, exp: "لوقوع حرف الاستعلاء.", year: "أغسطس 2026" },

        { q: "لم يذكر الناظم إلا حكم ترقيق الراء المكسورة وصلا.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (ذكر الساكنة أيضاً).", year: "أغسطس 2026" },

        { q: "تفخم الراء إذا كانت مفتوحة أو مضمومة.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح.", year: "معلومات الشرح" },
        { q: "الوقف على كلمة (القطر) اختار الإمام ابن الجزري فيه التفخيم.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (اختار الترقيق نظراً لحال الوصل).", year: "معلومات الشرح" },
        { q: "حكم الراء المرامة في حالة الوقف بالضم هو التفخيم.", type: "TF", options: ["صح", "خطأ"], ans: 0, exp: "صح (تعامل كالوصل).", year: "يونيو 2025" },
        { q: "ينقسم الراء من حيث التفخيم والترقيق إلى قسمين فقط.", type: "TF", options: ["صح", "خطأ"], ans: 1, exp: "خطأ (ثلاثة أقسام).", year: "ديسمبر 2024" }
    ];

    let studentName = "";
    let selectedModelName = "";
    let score = 0;
    let currentQuestionIndex = 0;
    let activeQuestions = [];
    let wrongQuestionsLog = []; 
    let wrongQuestionsObjects = []; 
    let isRetryMode = false;

    function startQuiz() {
        const nameInput = document.getElementById("student-name").value.trim();
        const modelSelect = document.getElementById("model-select");
        
        if (nameInput === "") {
            alert("يرجى إدخال اسمك للمتابعة.");
            return;
        }
        
        selectedModelName = modelSelect.options[modelSelect.selectedIndex].text;
        studentName = nameInput + " (" + selectedModelName + ")"; 
        
        if (modelSelect.value === "1") activeQuestions = [...model1];
        else if (modelSelect.value === "2") activeQuestions = [...model2];
        else activeQuestions = [...model3];

        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        
        score = 0;
        wrongQuestionsLog = [];
        wrongQuestionsObjects = [];
        currentQuestionIndex = 0;
        loadQuestion();
    }

    function updateProgressBar() {
        const progressPercentage = (currentQuestionIndex / activeQuestions.length) * 100;
        document.getElementById("progress-bar").style.width = progressPercentage + "%";
        document.getElementById("progress-text").innerText = `السؤال ${currentQuestionIndex + 1} من ${activeQuestions.length}`;
    }

    function loadQuestion() {
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").classList.add("hidden");
        
        updateProgressBar();
        const q = activeQuestions[currentQuestionIndex];
        
        const badgeContainer = document.getElementById("badge-container");
        if(q.type === "Fill") {
            badgeContainer.innerHTML = `<span class="badge">سؤال استشهاد (من اختبارات الوزارة)</span>`;
        } else {
            badgeContainer.innerHTML = "";
        }

        document.getElementById("question-text").innerText = q.q;
        document.getElementById("year-footer").innerText = `المصدر: ${q.year}`;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.className = "option-btn";
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);

        const q = activeQuestions[currentQuestionIndex];
        const feedbackDiv = document.getElementById("feedback");
        feedbackDiv.style.display = "block";

        if (selectedIndex === q.ans) {
            btnElement.classList.add("correct");
            feedbackDiv.style.backgroundColor = "#e8f5e9";
            feedbackDiv.style.color = "#2e7d32";
            feedbackDiv.innerText = "إجابة صحيحة ✔️\nالتعليل: " + q.exp;
            if (!isRetryMode) score += 2; 
        } else {
            btnElement.classList.add("wrong");
            buttons[q.ans].classList.add("correct"); 
            feedbackDiv.style.backgroundColor = "#ffebee";
            feedbackDiv.style.color = "#c62828";
            feedbackDiv.innerText = "إجابة خاطئة ❌\nالصواب: " + q.options[q.ans];
            
            if (!isRetryMode) {
                wrongQuestionsLog.push(q.q); 
                wrongQuestionsObjects.push(q); 
            }
        }
        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        
        document.getElementById("progress-bar").style.width = "100%";
        
        document.getElementById("student-name-display").innerText = "الطالبة: " + studentName;
        document.getElementById("score").innerText = score;
        
        const totalPossible = isRetryMode ? score : (activeQuestions.length * 2); 
        document.getElementById("total-score").innerText = activeQuestions.length * 2;

        const retryBtn = document.getElementById("retry-btn");
        if (wrongQuestionsObjects.length > 0 && !isRetryMode) {
            retryBtn.classList.remove("hidden");
        } else {
            retryBtn.classList.add("hidden");
        }

        if (!isRetryMode) {
            sendDataToSheet(totalPossible);
        } else {
            document.getElementById("saving-msg").classList.add("hidden");
        }
    }

    function retryWrongQuestions() {
        isRetryMode = true;
        activeQuestions = [...wrongQuestionsObjects];
        wrongQuestionsObjects = [];
        currentQuestionIndex = 0;
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function sendDataToSheet(totalPossible) {
        const payload = {
            name: studentName,
            score: score,
            total: totalPossible,
            wrongQuestions: wrongQuestionsLog 
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById("saving-msg").innerText = "تم حفظ النتيجة بنجاح في سجل المعلمة ✔️";
            document.getElementById("saving-msg").style.color = "#27ae60";
        }).catch(err => {
            document.getElementById("saving-msg").innerText = "حدث خطأ أثناء حفظ النتيجة.";
            document.getElementById("saving-msg").style.color = "#e74c3c";
        });
    }
</script>
