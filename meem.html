<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تدريب أحكام النون والميم المشددتين والميم الساكنة</title>
    <style>
        :root {
            --primary: #d35400; /* لون برتقالي نحاسي مميز لهذا الباب */
            --secondary: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #fdfaf6;
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 25px 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); width: 100%; max-width: 650px; box-sizing: border-box; position: relative; margin-bottom: 20px; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.45rem; line-height: 1.5; }
        .input-group { margin: 20px 0; text-align: center; }
        input[type="text"] { width: 90%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; text-align: center; outline: none; margin-bottom: 15px; font-family: inherit; }
        input[type="text"]:focus { border-color: var(--secondary); }
        button.start-btn { background-color: var(--secondary); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 90%; font-weight: bold; }
        .progress-bar-container { width: 100%; background-color: #e0e0e0; border-radius: 8px; margin-bottom: 10px; height: 12px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--success); width: 0%; transition: width 0.4s ease; }
        .progress-text { font-size: 0.9rem; color: #7f8c8d; text-align: center; margin-bottom: 15px; font-weight: bold; }
        .badge { display: inline-block; background-color: #f39c12; color: white; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; line-height: 1.5; margin-bottom: 20px; font-weight: bold; color: var(--primary); }
        .option-btn { display: block; width: 100%; margin: 10px 0; background-color: #fff; color: var(--text); border: 2px solid #ecf0f1; padding: 15px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.2s; text-align: right; line-height: 1.5; }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background-color: #fef5ec; }
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        #feedback { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 0.95rem; line-height: 1.4; font-weight: bold; }
        .next-btn-container { text-align: center; margin-top: 20px; }
        #next-btn { background-color: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
        .year-footer { margin-top: 20px; font-size: 0.8rem; color: #95a5a6; text-align: left; border-top: 1px solid #eee; padding-top: 10px; }
        .hidden { display: none !important; }
        .result-container { text-align: center; }
        .score-display { font-size: 2.5rem; color: var(--success); font-weight: bold; margin: 20px 0; }
        .retry-btn { background-color: #c0392b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 15px;}
        .teacher-footer { text-align: center; color: #7f8c8d; font-size: 0.95rem; line-height: 1.6; padding: 10px; max-width: 650px; width: 100%; border-top: 2px solid #ddd; margin-top: auto; }
        .teacher-footer strong { color: var(--primary); }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>تدريب باب أحكام النون والميم المشددتين والميم الساكنة</h2>
    <div class="input-group">
        <p>الرجاء إدخال اسمك للبدء في الاختبار (8 أسئلة):</p>
        <input type="text" id="student-name" placeholder="الاسم الثلاثي">
    </div>
    <div style="text-align: center;">
        <button class="start-btn" onclick="startQuiz()">ابدأ التدريب</button>
    </div>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
    <div class="progress-text" id="progress-text"></div>
    
    <div id="badge-container"><span class="badge">أسئلة معتمدة من الوزارة</span></div>
    <div class="question-text" id="question-text"></div>
    <div id="options-container"></div>
    <div id="feedback"></div>
    
    <div class="next-btn-container">
        <button id="next-btn" class="hidden" onclick="nextQuestion()">السؤال التالي</button>
    </div>
    <div class="year-footer" id="year-footer"></div>
</div>

<div class="container hidden result-container" id="result-screen">
    <h2 id="result-title">انتهى التدريب!</h2>
    <p style="font-size: 1.2rem;" id="student-name-display"></p>
    <div class="score-display"><span id="score"></span> / <span id="total-score"></span></div>
    <p id="saving-msg" style="color: #7f8c8d;">جاري حفظ النتيجة في السجل...</p>
    <button id="retry-btn" class="retry-btn hidden" onclick="retryWrongQuestions()">إعادة حل الأسئلة الخاطئة</button>
</div>

<div class="teacher-footer">
    إعداد وتصميم المعلمة الأولى: <strong>أميرة محمد السيد</strong> <br>
    بمركز جويرية بنت الحارث | للاستفسار: 36837886
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwStG344rSY9oWOMDAXb2xOavyJpb__dOnohWSVF3gz60-xtYmnm34YKlm40J5sgsrv/exec";

    const allQuestions = [
        { 
            q: "مراتب الغنة في النون والميم هي:", 
            options: [
                "أربع مراتب", 
                "ثلاث مراتب", 
                "خمس مراتب",
                "مرتبتان"
            ], 
            ans: 0, 
            exp: "الغنة صفة لازمة للنون والميم، إلا أنها في الساكن أكمل من المتحرك، وفي المخفي أزيد من المظهر، وفي المدغم أوفى من المخفي.", 
            year: "يونيو 2024 / فبراير 2025 / فبراير 2026" 
        },
        { 
            q: "معنى قول الناظم: (وأظهر الغنة من نون ومن ... ميم إذا ما شددا) أي: بين وبالغ في إظهار الغنة الصادرة من نون وميم مشددتين؛ لأنها تكون في أوفى وأكمل مراتبها.", 
            options: [
                "صح", 
                "خطأ"
            ], 
            ans: 0, 
            exp: "أمر الناظم بالمبالغة في إظهار الغنة في النون والميم المشددتين نحو (إنّ) و(ثمّ) لكونها في أكمل مراتبها.", 
            year: "أبريل 2025 / مايو 2026" 
        },
        { 
            q: "استشهد من المقدمة الجزرية على حكم النون والميم المشددتين؟", 
            options: [
                "(وَأَظْهِرِ الْغُنَّةَ مِنْ نُونٍ وَمِنْ ... مِيمٍ إِذَا مَا شُدِّدَا ...)", 
                "(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)", 
                "(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)"
            ], 
            ans: 0, 
            exp: "يجب إظهار الغنة وبيانها في النون والميم إذا كانتا مشددتين سواء في كلمة أو كلمتين.", 
            year: "بنك الأسئلة الوزارية المعتمدة" 
        },
        { 
            q: "استشهد من المقدمة الجزرية على حكم الميم المشددة؟", 
            options: [
                "(وَأَظْهِرِ الْغُنَّةَ مِنْ ... مِيمٍ إِذَا مَا شُدِّدَا ...)", 
                "(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)", 
                "(وَحُكْمُ تَنْوِينٍ وَنُونٍ يُلْفَى ... إِظْهَارٌ ادْغَامٌ وَقَلْبٌ اخْفَا)"
            ], 
            ans: 0, 
            exp: "التشديد في الميم يشمل المدغمة في مثلها في كلمة أو كلمتين نحو (مَا لَهُم مِّنَ اللَّهِ) فتظهر فيها الغنة.", 
            year: "بنك الأسئلة الوزارية المعتمدة" 
        },
        { 
            q: "استشهد من كلام المصنف على القول الصحيح المختار من أقوال أهل الأداء لإخفاء الميم الساكنة لدى الباء؟", 
            options: [
                "(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)", 
                "(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)", 
                "(وَالْقَلْبُ عِنْدَ الْبَا بِغُنَّةٍ كَذَا ... الإِخْفَا لَدَى بَاقِي الْحُرُوفِ أُخِذَا)"
            ], 
            ans: 0, 
            exp: "تُخفى الميم الساكنة بغنة إذا وقع بعدها حرف الباء نحو (يَعْتَصِم بِاللَّهِ) على القول المختار عند الجمهور.", 
            year: "أبريل 2024 / أكتوبر 2025" 
        },
        { 
            q: "بين القول المختار من أقوال أهل الأداء من عبارة الناظم: (على المختار من أهل الأدا)؟", 
            options: [
                "القول المختار هو إخفاء الميم الساكنة عند الباء.", 
                "القول المختار هو إظهار الميم الساكنة عند الباء بلا غنة.", 
                "القول المختار هو إدغام الميم الساكنة في الباء إدغاماً كاملاً."
            ], 
            ans: 0, 
            exp: "مذهب الجمهور وابن مجاهد والداني وما اختاره ابن الجزري هو إخفاء الميم الساكنة مع الغنة عند الباء.", 
            year: "فبراير 2026" 
        },
        { 
            q: "استشهد من المقدمة الجزرية على إظهار الميم الساكنة عند حروف الهجاء؟", 
            options: [
                "(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)", 
                "(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)", 
                "(وَأَظْهِرِ الْغُنَّةَ مِنْ نُونٍ وَمِنْ ... مِيمٍ إِذَا مَا شُدِّدَا)"
            ], 
            ans: 0, 
            exp: "تُظهر الميم الساكنة عند باقي حروف الهجاء (غير الميم والباء) سواء في كلمة نحو (أَنْعَمْتَ) أو كلمتين.", 
            year: "فبراير 2025 / أغسطس 2025 / فبراير 2026" 
        },
        { 
            q: "استشهد من قول الناظم على التحذير من إخفاء الميم الساكنة خاصة عند حرفي الواو والفاء؛ لاتحاد مخرجها بالواو وقربها من الفاء؟", 
            options: [
                "(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)", 
                "(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)", 
                "(وَاحْرِصْ عَلَى السُّكُونِ فِي جَعَلْنَا ... أَنْعَمْتَ وَالْمَغْضُوبِ مَعْ ضَلَلْنَا)"
            ], 
            ans: 0, 
            exp: "حذّر الناظم من اختفاء الميم الساكنة عند الواو والفاء لاتحاد مخرجها بالواو وقربها من الفاء فيسبق اللسان إلى الإخفاء.", 
            year: "فبراير 2024 / يونيو 2025 / مايو 2026" 
        }
    ];

    let studentName = "";
    let score = 0;
    let currentQuestionIndex = 0;
    let activeQuestions = [];
    let wrongQuestionsLog = []; 
    let wrongQuestionsObjects = []; 
    let isRetryMode = false;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() {
        const nameInput = document.getElementById("student-name").value.trim();
        if (nameInput === "") { alert("يرجى إدخال اسمك للمتابعة."); return; }
        
        studentName = nameInput; 
        activeQuestions = shuffleArray([...allQuestions]);
        
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        
        score = 0; wrongQuestionsLog = []; wrongQuestionsObjects = []; currentQuestionIndex = 0;
        loadQuestion();
    }

    function updateProgressBar() {
        const progressPercentage = (currentQuestionIndex / activeQuestions.length) * 100;
        document.getElementById("progress-bar").style.width = progressPercentage + "%";
        document.getElementById("progress-text").innerText = `السؤال ${currentQuestionIndex + 1} من ${activeQuestions.length}`;
    }

    function loadQuestion() {
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").classList.add("hidden");
        updateProgressBar();
        const q = activeQuestions[currentQuestionIndex];
        
        document.getElementById("question-text").innerText = q.q;
        document.getElementById("year-footer").innerText = `المصدر: اختبارات (${q.year})`;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        let shuffledOptions = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));
        shuffledOptions = shuffleArray(shuffledOptions);
        
        shuffledOptions.forEach((optObj) => {
            const btn = document.createElement("button");
            btn.innerText = optObj.text;
            btn.className = "option-btn";
            btn.onclick = () => checkAnswer(optObj.originalIndex, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOriginalIndex, btnElement) {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);
        const q = activeQuestions[currentQuestionIndex];
        const feedbackDiv = document.getElementById("feedback");
        feedbackDiv.style.display = "block";

        if (selectedOriginalIndex === q.ans) {
            btnElement.classList.add("correct");
            feedbackDiv.style.backgroundColor = "#e8f5e9";
            feedbackDiv.style.color = "#2e7d32";
            feedbackDiv.innerText = "إجابة صحيحة ✔️\nالتعليل: " + q.exp;
            if (!isRetryMode) score += 2; 
        } else {
            btnElement.classList.add("wrong");
            buttons.forEach(b => { if (b.innerText === q.options[q.ans]) b.classList.add("correct"); });
            feedbackDiv.style.backgroundColor = "#ffebee";
            feedbackDiv.style.color = "#c62828";
            feedbackDiv.innerText = "إجابة خاطئة ❌\nالصواب: " + q.options[q.ans];
            if (!isRetryMode) { wrongQuestionsLog.push(q.q); wrongQuestionsObjects.push(q); }
        }
        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) loadQuestion();
        else endQuiz();
    }

    function endQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("progress-bar").style.width = "100%";
        
        document.getElementById("student-name-display").innerText = "الطالبة: " + studentName;
        document.getElementById("score").innerText = score;
        const totalPossible = isRetryMode ? score : (activeQuestions.length * 2); 
        document.getElementById("total-score").innerText = activeQuestions.length * 2;

        const retryBtn = document.getElementById("retry-btn");
        if (wrongQuestionsObjects.length > 0 && !isRetryMode) {
            document.getElementById("result-title").innerText = "يوجد أخطاء تحتاج للتصحيح!";
            retryBtn.classList.remove("hidden");
        } else {
            document.getElementById("result-title").innerText = "عمل رائع! التدريب مكتمل بنجاح.";
            retryBtn.classList.add("hidden");
        }

        if (!isRetryMode) sendDataToSheet(totalPossible);
        else document.getElementById("saving-msg").classList.add("hidden");
    }

    function retryWrongQuestions() {
        isRetryMode = true;
        activeQuestions = shuffleArray([...wrongQuestionsObjects]);
        wrongQuestionsObjects = [];
        currentQuestionIndex = 0;
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function sendDataToSheet(totalPossible) {
        const payload = { name: studentName + " (النون والميم المشددتين والميم الساكنة)", score: score, total: totalPossible, wrongQuestions: wrongQuestionsLog };
        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(() => {
            document.getElementById("saving-msg").innerText = "تم حفظ النتيجة بنجاح في سجل المعلمة ✔️";
            document.getElementById("saving-msg").style.color = "#27ae60";
        }).catch(err => {
            document.getElementById("saving-msg").innerText = "حدث خطأ أثناء حفظ النتيجة.";
            document.getElementById("saving-msg").style.color = "#e74c3c";
        });
    }
</script>
</body>
</html>
