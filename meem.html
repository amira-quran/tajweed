<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fdfaf6;--glow:#fef5ec;--card:#fff;--ink:#333;--mut:#7f8c8d;--line:#ecf0f1;--pri:#d35400;--pri2:#fae5d3;--ok:#27ae60;--okb:#e8f5e9;--no:#e74c3c;--nob:#ffebee;--wn:#f39c12;--wnb:#fef5ec;--hl:#8e44ad;--onhl:#fff;--c0:#0284c7;--c1:#10b981;--c2:#f59e0b;--c3:#8b5cf6;--c4:#ec4899;--sh:0 8px 20px rgba(0,0,0,0.08);color-scheme:light}

.bb{position:absolute;bottom:-30px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff14;animation:fl 7s ease-in infinite}
@keyframes fl{from{transform:translateY(0);opacity:0}25%{opacity:1}to{transform:translateY(-220px);opacity:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0;box-shadow:var(--sh);transition:opacity .5s,transform .5s,background .4s,border-color .4s}

.opt:active{transform:scale(.97)}.opts:not(.done) .opt:hover{border-color:var(--pri); background:var(--glow);}.opt:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);transition:.2s}
.opt.sel{border-color:var(--pri);background:var(--pri2);box-shadow:0 6px 16px -8px var(--pri)}.opt.sel .rd{border:6px solid var(--pri);animation:pop .3s}

.done .opt{cursor:default;opacity:.6}.done .opt.ok,.done .opt.bad{opacity:1}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .rd{border:6px solid var(--ok)}
.opt.bad{border-color:var(--no);background:var(--nob);animation:sk .4s}.opt.bad .rd{border:6px solid var(--no)}
.opt.ok::after,.opt.bad::after{content:'✓';margin-inline-start:auto;font-weight:700;color:var(--ok)}.opt.bad::after{content:'✗';color:var(--no)}
@keyframes sk{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.sub.miss{animation:ms 1.4s}@keyframes ms{0%,60%{background:var(--wnb)}}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.fb.on{grid-template-rows:1fr}.fb>div{overflow:hidden}

.fb .g{background:var(--okb);border-inline-start:4px solid var(--ok); color: var(--ok);}.fb .r{background:var(--nob);border-inline-start:4px solid var(--no); color: var(--no);}
.btn{width:100%;min-height:56px;font:700 18px Cairo,sans-serif;border:0;border-radius:16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#d35400,#f39c12);box-shadow:var(--sh);transition:transform .15s,filter .2s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.08)}.btn.rt{background:linear-gradient(135deg,#c0392b,#e74c3c);margin-top:14px}
#res{display:none;text-align:center}#res.show{display:block;animation:up .6s both}@keyframes up{from{opacity:0;transform:translateY(20px)}}
.rw{position:relative;width:145px;margin:auto}.ring{width:145px;display:block;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.rb{stroke:var(--line)}
.rf{stroke:var(--c);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}

#res h2{margin:10px 0 0; color: var(--ink);}#res p{margin:4px 0; color: var(--mut);}.st{font-size:14px;color:var(--mut); margin-top: 10px; font-weight: bold;}
.ts{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:420px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;text-align:center;transform:translateY(160%);transition:transform .4s cubic-bezier(.3,1.4,.5,1);z-index:30}.ts.on{transform:none}
.foot{text-align:center;font-size:14px;color:var(--mut);margin-top:24px;font-weight:700; border-top: 2px solid var(--line); padding-top: 16px;}
.foot strong { color: var(--pri); }
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwStG344rSY9oWOMDAXb2xOavyJpb__dOnohWSVF3gz60-xtYmnm34YKlm40J5sgsrv/exec";
const MAX_SCORE=16;
const $=id=>document.getElementById(id);

/* بنية الأسئلة: [النص، الإجابة الصحيحة، الخيارات، التغذية الراجعة، وزن الدرجة] */
const Q=[
{t:'السؤال الأول',p:2,sk:'يونيو 24 / فبراير 25 / فبراير 26',s:[
['مراتب الغنة في النون والميم هي:','خمس مراتب',['خمس مراتب','أربع مراتب','ثلاث مراتب','مرتبتان'],'المرتبة الأولى: المشدد، الثانية: المدغم، الثالثة: المخفى والمقلب، الرابعة: الساكن المظهر، الخامسة: المتحرك.',2]
]},
{t:'السؤال الثاني',p:2,sk:'أبريل 2025 / مايو 2026',s:[
['معنى قول الناظم: (وأظهر الغنة من نون ومن ... ميم إذا ما شددا) أي: بين وبالغ في إظهار الغنة الصادرة من نون وميم مشددتين؛ لأنها تكون في أوفى وأكمل مراتبها.','صح',['صح','خطأ'],'أمر الناظم بالمبالغة في إظهار الغنة في النون والميم المشددتين نحو (إنّ) و(ثمّ) لكونها في أكمل مراتبها.',2]
]},
{t:'السؤال الثالث',p:2,sk:'أسئلة وزارية معتمدة',s:[
['استشهد من المقدمة الجزرية على حكم النون والميم المشددتين؟','(وَأَظْهِرِ الْغُنَّةَ مِنْ نُونٍ وَمِنْ ... مِيمٍ إِذَا مَا شُدِّدَا ...)',['(وَأَظْهِرِ الْغُنَّةَ مِنْ نُونٍ وَمِنْ ... مِيمٍ إِذَا مَا شُدِّدَا ...)','(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)','(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)'],'يجب إظهار الغنة وبيانها في النون والميم إذا كانتا مشددتين سواء في كلمة أو كلمتين.',2]
]},
{t:'السؤال الرابع',p:2,sk:'أسئلة وزارية معتمدة',s:[
['استشهد من المقدمة الجزرية على حكم الميم المشددة؟','(وَأَظْهِرِ الْغُنَّةَ مِنْ ... مِيمٍ إِذَا مَا شُدِّدَا ...)',['(وَأَظْهِرِ الْغُنَّةَ مِنْ ... مِيمٍ إِذَا مَا شُدِّدَا ...)','(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)','(وَحُكْمُ تَنْوِينٍ وَنُونٍ يُلْفَى ... إِظْهَارٌ ادْغَامٌ وَقَلْبٌ اخْفَا)'],'التشديد في الميم يشمل المدغمة في مثلها في كلمة أو كلمتين نحو (مَا لَهُم مِّنَ اللَّهِ) فتظهر فيها الغنة.',2]
]},
{t:'السؤال الخامس',p:2,sk:'أبريل 2024 / أكتوبر 2025',s:[
['استشهد من كلام المصنف على القول الصحيح المختار من أقوال أهل الأداء لإخفاء الميم الساكنة لدى الباء؟','(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)',['(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)','(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)','(وَالْقَلْبُ عِنْدَ الْبَا بِغُنَّةٍ كَذَا ... الإِخْفَا لَدَى بَاقِي الْحُرُوفِ أُخِذَا)'],'تُخفى الميم الساكنة بغنة إذا وقع بعدها حرف الباء نحو (يَعْتَصِم بِاللَّهِ) على القول المختار عند الجمهور.',2]
]},
{t:'السؤال السادس',p:2,sk:'فبراير 2026',s:[
['بين القول المختار من أقوال أهل الأداء من عبارة الناظم: (على المختار من أهل الأدا)؟','القول المختار هو إخفاء الميم الساكنة عند الباء.',['القول المختار هو إخفاء الميم الساكنة عند الباء.','القول المختار هو إظهار الميم الساكنة عند الباء بلا غنة.','القول المختار هو إدغام الميم الساكنة في الباء إدغاماً كاملاً.'],'مذهب الجمهور وابن مجاهد والداني وما اختاره ابن الجزري هو إخفاء الميم الساكنة مع الغنة عند الباء.',2]
]},
{t:'السؤال السابع',p:2,sk:'فبراير 25 / أغسطس 25 / فبراير 26',s:[
['استشهد من المقدمة الجزرية على إظهار الميم الساكنة عند حروف الهجاء؟','(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)',['(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)','(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)','(وَأَظْهِرِ الْغُنَّةَ مِنْ نُونٍ وَمِنْ ... مِيمٍ إِذَا مَا شُدِّدَا)'],'تُظهر الميم الساكنة عند باقي حروف الهجاء (غير الميم والباء) سواء في كلمة نحو (أَنْعَمْتَ) أو كلمتين.',2]
]},
{t:'السؤال الثامن',p:2,sk:'فبراير 2024 / يونيو 2025 / مايو 2026',s:[
['استشهد من قول الناظم على التحذير من إخفاء الميم الساكنة خاصة عند حرفي الواو والفاء؛ لاتحاد مخرجها بالواو وقربها من الفاء؟','(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)',['(وَأَظْهِرَنَّهَا عِنْدَ بَاقِي الْأَحْرُفِ ... وَاحْذَرْ لَدَى وَاوٍ وَفَا أَنْ تَخْتَفِي)','(وَأَخْفِيَنَّ الْمِيمَ إِنْ تَسْكُنْ بِغُنَّةٍ لَدَى ... بَاءٍ عَلَى الْمُخْتَارِ مِنْ أَهْلِ الْأَدَا)','(وَاحْرِصْ عَلَى السُّكُونِ فِي جَعَلْنَا ... أَنْعَمْتَ وَالْمَغْضُوبِ مَعْ ضَلَلْنَا)'],'حذّر الناظم من اختفاء الميم الساكنة عند الواو والفاء لاتحاد مخرجها بالواو وقربها من الفاء فيسبق اللسان إلى الإخفاء.',2]
]}
];

const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return;
  const el=en.target;io.unobserve(el);
  if(el.classList.contains('rv'))el.classList.add('in');
}),{threshold:.25});

let S=[],locked=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ptl=p=>p==1?'درجة':p==2?'درجتان':p+' درجات';

function build(){
  S=[];locked=false;
  
  // خلط الأسئلة
  const shuffledQ = shuf([...Q]);
  
  $('qs').innerHTML=shuffledQ.map((q,qi)=>`<section class="card rv"><header><b class="no">${qi+1}</b><h3>${q.t}</h3><div class="badges"><span class="sk-tag">${q.sk}</span><span class="pt">${ptl(q.p)}</span></div></header>${q.s.map(([l,a,o,e,w])=>{
    const op=o.length===2?o.slice():shuf([a,...o.filter(v=>v!==a)]),id=S.length;
    S.push({qText: l, a, e, op, ci: op.indexOf(a), sel: -1, w: w || 2});
    return `<div class="sub"><div class="lb">${l}</div><div class="opts" role="radiogroup" data-s="${id}">${op.map((v,i)=>`<button type="button" role="radio" aria-checked="false" class="opt" data-i="${i}"><span class="rd"></span><span>${v}</span></button>`).join('')}</div><div class="fb"><div></div></div></div>`;
  }).join('')}</section>`).join('');
  document.querySelectorAll('.card.rv').forEach(c=>io.observe(c));
  prog();
}

const prog=()=>{const n=S.filter(s=>s.sel>=0).length;$('cnt').textContent=`${n} / ${S.length}`;$('pg').style.width=n/S.length*100+'%'};
let tm;const toast=m=>{const t=$('ts');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2600)};

$('qs').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||locked)return;
  const g=b.parentNode;S[g.dataset.s].sel=+b.dataset.i;
  [...g.children].forEach(c=>{c.classList.toggle('sel',c===b);c.setAttribute('aria-checked',c===b)});
  g.parentNode.classList.remove('miss');prog();
  navigator.vibrate&&navigator.vibrate(8);
};

const esc=s=>s.replace(/[<>&"']/g,c=>'&#'+c.charCodeAt(0)+';');
$('f').onsubmit=e=>{
  e.preventDefault();if(locked)return;
  const nm=$('nm').value.trim();
  if(!nm){
    const el=$('nm');el.classList.remove('err');void el.offsetWidth;el.classList.add('err');
    el.focus();el.scrollIntoView({behavior:'smooth',block:'center'});
    toast('الرجاء إدخال اسمك الثلاثي للبدء');return;
  }
  const m=S.findIndex(s=>s.sel<0);
  if(m>=0){
    const el=document.querySelectorAll('.sub')[m];el.classList.add('miss');
    el.scrollIntoView({behavior:'smooth',block:'center'});
    toast(`بقي ${S.filter(s=>s.sel<0).length} سؤال بلا إجابة`);return;
  }
  
  locked=true;let sc=0;const els=document.querySelectorAll('.sub');
  let wrongQuestionsLog = [];
  
  S.forEach((s,i)=>{
    const el=els[i],ops=el.querySelectorAll('.opt'),ok=s.sel===s.ci;
    if(ok){
      sc+=s.w;
    } else {
      wrongQuestionsLog.push(s.qText); // إضافة السؤال الخاطئ للسجل
    }
    el.querySelector('.opts').classList.add('done');
    ops[s.ci].classList.add('ok');if(!ok)ops[s.sel].classList.add('bad');
    const fb=el.querySelector('.fb');
    fb.firstChild.innerHTML=`<p class="${ok?'g':'r'}">${ok?'✔ إجابة صحيحة. ':`✘ الإجابة الصحيحة: <b>${s.a}</b>. `}<br>${s.e||''}</p>`;
    fb.classList.add('on');
  });
  
  const pc=Math.round(sc/MAX_SCORE*100),c=pc>=75?'--ok':pc>=50?'--wn':'--no',msg=pc>=90?'ممتاز يا بطلة! 🌟':pc>=75?'جيد جداً 👏':pc>=50?'جيد، راجعي الأخطاء 📘':'تحتاجين مراجعة، أعيدي المحاولة 💪';
  const r=$('res');
  r.innerHTML=`<div class="rw"><svg class="ring" viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52" pathLength="100"/><circle class="rf" id="rf" style="--c:var(${c})" cx="60" cy="60" r="52" pathLength="100"/></svg><div class="rn" id="rn">0</div></div><h2>${msg}</h2><p>درجتك يا ${esc(nm)} هي <b>${sc}</b> من ${MAX_SCORE} (${pc}%)</p><p class="st" id="st"></p><button class="btn rt" id="rt" type="button">إعادة التدريب مرة أخرى 🔄</button>`;
  r.classList.add('show');$('sb').hidden=true;r.scrollIntoView({behavior:'smooth',block:'center'});
  
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $('rf').style.strokeDashoffset=100-pc;
    const t0=performance.now(),tk=t=>{
      const k=Math.min(1,(t-t0)/1400);
      $('rn').textContent=Math.round(sc*(1-Math.pow(1-k,3))*10)/10;
      k<1&&requestAnimationFrame(tk);
    };
    requestAnimationFrame(tk);
  }));
  
  $('rt').onclick=()=>{r.classList.remove('show');$('sb').hidden=false;build();scrollTo({top:0,behavior:'smooth'})};
  
  const st=$('st');
  if(GOOGLE_SCRIPT_URL){
    st.textContent='⏳ جاري حفظ النتيجة في سجل المعلمة...';
    
    // إرسال البيانات بنفس صيغة ملفك القديم
    const payload = { 
      name: nm + " (النون والميم المشددتين والميم الساكنة)", 
      score: sc, 
      total: MAX_SCORE, 
      wrongQuestions: wrongQuestionsLog 
    };
    
    fetch(GOOGLE_SCRIPT_URL,{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    }).then(()=>st.textContent='✅ تم حفظ النتيجة بنجاح في سجل المعلمة!')
      .catch(()=>st.textContent='⚠️ تعذر الاتصال بالسجل، ولكن تم عرض نتيجتك أعلاه.');
  }
};

const th=$('th'),ic=()=>th.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
th.onclick=()=>{const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}ic()};
ic();build();
</script>
</body>
</html>
